<!DOCTYPE html>
<html>
<head>
    <title>User Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 10px;
        }

        h1 {
            color: #8b0000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #555;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #0066cc;
            color: white;
        }

        td {
            background-color: #f9f9f9;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            margin-top: 25px;
            border-top: 1px solid #aaa;
            padding-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>WEB PROGRAMMING LAB 8</h1>

        <h2>User Information</h2>

        <table>
            <tr>
                <th>Name</th>
                <td id="displayName"></td>
            </tr>

            <tr>
                <th>Gender</th>
                <td id="displayGender"></td>
            </tr>

            <tr>
                <th>Mobile Number</th>
                <td id="displayMobile"></td>
            </tr>

            <tr>
                <th>Mail ID</th>
                <td id="displayEmail"></td>
            </tr>

            <tr>
                <th>City</th>
                <td id="displayCity"></td>
            </tr>

            <tr>
                <th>State</th>
                <td id="displayState"></td>
            </tr>

            <tr>
                <th>Country</th>
                <td id="displayCountry"></td>
            </tr>
        </table>

        <button onclick="window.location.href='index.html'">
            Back to Form
        </button>

        <footer>
            <b>Archit Singhania - 24BTTSN001</b>
        </footer>

    </div>

    <script>
        document.getElementById("displayName").innerHTML =
            localStorage.getItem("name");

        document.getElementById("displayGender").innerHTML =
            localStorage.getItem("gender");

        document.getElementById("displayMobile").innerHTML =
            localStorage.getItem("mobile");

        document.getElementById("displayEmail").innerHTML =
            localStorage.getItem("email");

        document.getElementById("displayCity").innerHTML =
            localStorage.getItem("city");

        document.getElementById("displayState").innerHTML =
            localStorage.getItem("state");

        document.getElementById("displayCountry").innerHTML =
            localStorage.getItem("country");
    </script>

</body>
</html>
